  { k: 0, cls: 'center hero', rail: 'Overview', t: 'Overview', html: '<p class="kick">Residence No. 7 · Cap Meridian</p><h1>Meridian</h1><p class="loc">A cliff-top house that is mostly horizon.</p><div class="specs"><div><b>5</b><span>Bedrooms</span></div><div><b>6.5</b><span>Baths</span></div><div><b>7,850</b><span>Sq ft</span></div><div><b>2.1</b><span>Acres</span></div></div><div class="cue"><i></i>Scroll to enter</div>' },

/* ------------------------------------------------------------ WebGL */

/* ------------------------------------------------------------ UI build */

addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCard(); });

/* ------------------------------------------------------------ state + input */

}
bGold.onclick = function () { setNight(0); }; bNight.onclick = function () { setNight(1); };
function resize() { var dpr = Math.min(devicePixelRatio || 1, 2); canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr); gl.viewport(0, 0, canvas.width, canvas.height); measure(); readScroll(); placeKnob(); }
addEventListener('resize', resize);

/* ------------------------------------------------------------ sound */
var AU = null, sndBtn = $('#snd');
function startAudio() {

sndBtn.onclick = function () {

  var on = !sndBtn.classList.contains('on');
  if (on) { AU.ctx.resume(); AU.out.gain.setTargetAtTime(.9, AU.ctx.currentTime, .6); } else AU.out.gain.setTargetAtTime(0, AU.ctx.currentTime, .3);

/* ------------------------------------------------------------ frame */
var scrimL = $('#scrimL'), scrimR = $('#scrimR'), scrimC = $('#scrimC'), scrimT = $('#scrimT'), last = performance.now(), hold = false;
function shotParams(i, local) {

  var mob = innerWidth / innerHeight < 1;
  return { z: z, pan: [s.dr[0] * (k - .5) * 2, s.dr[1] * (k - .5) * 2], par: [smx * .018 + s.dr[0] * (k - .5) * 1.4, -smy * .012], f: [mob ? s.fx : .5, .5] };
}
function frame(dt, now) {

  var tA = TEX[i], tB = TEX[j] || tA;
  if (!tA) { tA = { g: BLANK, n: BLANK, d: BLANK }; }
  if (!tB) tB = tA;
  bind(0, tA.g); bind(1, tA.n); bind(2, tA.d); bind(3, tB.g); bind(4, tB.n); bind(5, tB.d);
  gl.uniform1f(U.mixAB, mixAB); gl.uniform1f(U.night, night); gl.uniform1f(U.time, (now - t0) / 1000 % 100); gl.uniform1f(U.scrA, innerWidth / innerHeight);
  gl.uniform2f(U.zA, A.z, 0); gl.uniform2f(U.zB, B.z, 0); gl.uniform2f(U.panA, A.pan[0], A.pan[1]); gl.uniform2f(U.panB, B.pan[0], B.pan[1]);
  gl.uniform2f(U.parA, A.par[0], A.par[1]); gl.uniform2f(U.parB, B.par[0], B.par[1]); gl.uniform2f(U.fA, A.f[0], A.f[1]); gl.uniform2f(U.fB, B.f[0], B.f[1]);

  CH.forEach(function (c, ci) {
    var d = cur - c.k, o = 1 - smooth(.22, .5, Math.abs(d)); if (c.k === 0) o = 1 - smooth(.06, .35, cur);
    if (c.k === NSEG) o = smooth(NSEG - .4, NSEG - .1, cur);
    c.el.style.opacity = o.toFixed(3); var off = d * -46;
    c.el.style.transform = c.cls.indexOf('center') >= 0 ? 'translate(-50%,calc(-50% + ' + off.toFixed(1) + 'px))' : 'translateY(' + off.toFixed(1) + 'px)';
    c.el.style.pointerEvents = o > .6 ? 'auto' : 'none'; c.el.style.visibility = o < .01 ? 'hidden' : 'visible';
    if (cur >= c.k - .5) active = ci;

  scrimL.style.opacity = sL.toFixed(3); scrimR.style.opacity = sR.toFixed(3); scrimC.style.opacity = sC.toFixed(3); scrimT.style.opacity = sT.toFixed(3);
  $('#chapN').textContent = (active < 10 ? '0' : '') + active; $('#chapT').textContent = CH[active].t; $('#chapBar').style.transform = 'scaleX(' + (cur / NSEG).toFixed(4) + ')';

    var id = SHOTS[near].id, outside = /aerial|arrival|balcony|pool|final|door/.test(id);

  }
}
function tick(now) {

}

loadShot(0).then(function () { return loadShot(1); }).then(function () {

})();
